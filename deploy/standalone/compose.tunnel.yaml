# Optional: publish SEO Pilot on your own domain through a Cloudflare Tunnel.
# Put TUNNEL_TOKEN in deploy/standalone/.env.tunnel (kept out of Git), then add
# this file to the compose command. See docs/PUBLISH_ON_YOUR_DOMAIN.md.
services:
  tunnel:
    image: cloudflare/cloudflared:2026.7.3
    command: [tunnel, --no-autoupdate, run]
    env_file: [.env.tunnel]
    depends_on: [web]
    restart: unless-stopped
    cpus: 0.25
    mem_limit: 128m
    logging:
      driver: json-file
      options: { max-size: 5m, max-file: "2" }
