name: Publish image

# Builds the standalone image for amd64 and arm64 and publishes it to the
# GitHub Container Registry, so `scripts/install.sh` downloads a ready image
# instead of building one on your machine.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/standalone/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          provenance: false
          tags: ${{ env.IMAGE }}:${{ github.sha }}-${{ matrix.arch }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}

  manifest:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Log in
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Publish tags
        run: |
          tags="-t $IMAGE:${GITHUB_SHA} -t $IMAGE:${GITHUB_SHA::7}"
          if [ "$GITHUB_REF" = refs/heads/main ]; then tags="$tags -t $IMAGE:latest"; fi
          case "$GITHUB_REF" in refs/tags/v*) tags="$tags -t $IMAGE:${GITHUB_REF#refs/tags/}";; esac
          docker buildx imagetools create $tags \
            "$IMAGE:${GITHUB_SHA}-amd64" "$IMAGE:${GITHUB_SHA}-arm64"
